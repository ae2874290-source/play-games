<style>
:root{--blurple:#5865f2;--deep:#161cbb;--dark:#23272a;--ink:#23272a;--paper:#fff;--soft:#f2f3ff;--dkbtn:#23272a;--offbg:rgba(0,0,0,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1e1f22;--ink:#f2f3f5;--soft:#2b2d31;--dkbtn:#5865f2;--offbg:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--paper:#1e1f22;--ink:#f2f3f5;--soft:#2b2d31;--dkbtn:#5865f2;--offbg:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html{background:var(--dark);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:600 18px/1.55 Nunito,"IBM Plex Sans Arabic","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.btn{display:inline-flex;align-items:center;border-radius:28px;padding:14px 28px;font:800 17px/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer;border:0;background:#fff;color:var(--blurple);transition:background .15s,color .15s,transform .15s}
.btn:hover{background:var(--dark);color:#fff}
.btn.dk{background:var(--dkbtn);color:#fff}
.btn.dk:hover{background:#fff;color:var(--blurple)}
.btn.off{background:var(--offbg);color:var(--ink);cursor:default}
.btn:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}
h1,h2{font-weight:900;text-transform:uppercase;line-height:1.05;margin:0}
.hero{position:relative;overflow:hidden;background:var(--blurple);color:#fff;text-align:center;padding:170px 20px 90px}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,var(--deep),transparent 70%)}
.hero>*{position:relative}
nav{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));inset-inline:0;display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:1200px;margin:0 auto;padding:0 20px;padding-inline-end:76px;z-index:2}
.logo{font-weight:900;font-size:28px}
.side{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{font:800 15px inherit;font-family:inherit;color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:24px;padding:10px 14px;cursor:pointer}
select option{color:#000}
nav .btn{padding:9px 16px;font-size:14px}
h1{font-size:clamp(40px,9vw,88px);max-width:11em;margin:0 auto 20px}
.hero p{max-width:34em;margin:0 auto 32px;font-size:20px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.float{display:flex;justify-content:center;gap:12px;margin-top:40px}
.fl{width:clamp(60px,16vw,92px);aspect-ratio:1;border-radius:28px;display:grid;place-items:center;box-shadow:0 12px 0 rgba(0,0,0,.18)}
.fl svg,.art svg{width:55%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fl:nth-child(1){background:#eb459e;transform:rotate(-9deg) translateY(10px)}
.fl:nth-child(2){background:#3ba55c;transform:translateY(-10px)}
.fl:nth-child(3){background:#faa61a;transform:rotate(9deg) translateY(10px)}
.band{background:var(--dark);color:#fff;overflow:hidden;white-space:nowrap;padding:18px 0}
.track{display:inline-flex;gap:36px;animation:go 22s linear infinite;font-weight:900;font-size:28px;text-transform:uppercase}
.track span:nth-child(even){color:var(--blurple)}
@keyframes go{to{transform:translateX(-50%)}}
[dir=rtl] .track{animation-direction:reverse}
@media (prefers-reduced-motion:reduce){.track{animation:none}}
.feat{display:flex;align-items:center;justify-content:center;gap:40px;padding:64px 20px}
.feat:nth-of-type(even){background:var(--soft);flex-direction:row-reverse}
.art{flex:none;width:min(220px,60vw);aspect-ratio:1;border-radius:32px;display:grid;place-items:center;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.txt{max-width:30em}
h2{font-size:clamp(32px,5vw,52px);margin-bottom:16px}
.txt p{margin:0 0 24px}
@media (max-width:820px){.feat,.feat:nth-of-type(even){flex-direction:column;gap:28px;padding:48px 20px;text-align:center}}
.cta{background:var(--blurple);color:#fff;text-align:center;padding:110px 20px}
.cta h2{max-width:12em;margin:0 auto 32px;font-size:clamp(34px,7vw,72px)}
footer{background:var(--dark);color:#b9bbbe;text-align:center;padding:36px 20px;font-size:15px}
.ghost{background:rgba(255,255,255,.18);color:#fff}
.ghost:hover{background:#fff;color:var(--blurple)}
@media (max-width:560px){nav{flex-wrap:wrap}.side{width:100%}.hero{padding-top:240px}}
.tg{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));inset-inline-end:16px;z-index:20;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:#23272a;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);display:grid;place-items:center;cursor:pointer}
.tg:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tg svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tg .sun{display:none}
:root[data-theme="dark"] .tg .moon{display:none}
:root[data-theme="dark"] .tg .sun{display:block}
dialog{border:0;border-radius:28px;padding:28px;width:min(400px,92vw);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:28px;margin-bottom:12px}
dialog p{margin:0 0 18px;font-size:16px}
label{display:block;margin-bottom:14px;font-size:15px}
label input{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;border:2px solid rgba(128,128,128,.4);background:var(--soft);color:var(--ink);font:inherit}
label input:focus{outline:0;border-color:var(--blurple)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.pp{background:#ffc439;color:#111}
.pp:hover{background:#f0b429;color:#111}
.nt{color:var(--blurple)}
.ic{position:absolute;width:min(var(--s,56px),20vw);aspect-ratio:1;height:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(var(--r,0deg));pointer-events:none}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.hero>.deco{position:absolute}
.hero .ic{color:#fff;opacity:.3}
.feat .ic{color:var(--ink);opacity:.09}
.cta .ic{color:#fff;opacity:.28}
.feat,.cta{position:relative;overflow:hidden}
.feat>:not(.deco),.cta>:not(.deco){position:relative;z-index:1}
@media (max-width:560px){.hero .ic.s{display:none}.hero .ic{opacity:.22}}
</style>
</head>
