<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Game</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surf:#fff;--bd:#e5e5e5;--tx:#4b4b4b;--mut:#afafaf;--g:#58cc02;--gs:#58a700;--b:#1cb0f6;--bs:#1899d6;--r:#ff4b4b;--rs:#ea2b2b;--y:#ffc800;--okbg:#d7ffb8;--nobg:#ffdfe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--surf:#202f36;--bd:#37464f;--tx:#f1f7fb;--mut:#7b8a93;--okbg:#1d3b14;--nobg:#3d1a1d}}
:root[data-theme="dark"]{--bg:#131f24;--surf:#202f36;--bd:#37464f;--tx:#f1f7fb;--mut:#7b8a93;--okbg:#1d3b14;--nobg:#3d1a1d}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:800 18px/1.4 Nunito,"IBM Plex Sans Arabic","PingFang SC",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 16px 170px;min-height:100vh}
section{width:min(440px,100%)}
a{color:var(--b);text-decoration:none}
h1{font-size:28px;font-weight:900;text-align:center;margin:12px 0 8px}
.path{display:flex;flex-direction:column;align-items:center;gap:44px;padding:24px 0 40px}
.nd{width:76px;height:76px;border-radius:50%;border:0;background:var(--g);color:#fff;font:900 28px inherit;font-family:inherit;box-shadow:0 8px 0 var(--gs);cursor:pointer;position:relative;transform:translateX(var(--x))}
.nd:active:not(:disabled){translate:0 4px;box-shadow:0 4px 0 var(--gs)}
.nd.hard{background:var(--r);box-shadow:0 8px 0 var(--rs)}
.nd:disabled{background:var(--bd);color:var(--mut);box-shadow:0 8px 0 var(--mut);cursor:not-allowed}
.nd small{position:absolute;bottom:-30px;inset-inline:0;font-size:15px;color:var(--y);letter-spacing:2px}
.nd:focus-visible,.bt:focus-visible,.c:focus-visible,.x:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.tb{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.x{background:none;border:0;color:var(--mut);font-size:30px;line-height:1;cursor:pointer;padding:4px 8px;font-family:inherit}
.pg{flex:1;height:16px;background:var(--bd);border-radius:8px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--g);border-radius:8px;transition:width .3s}
.hr{color:var(--r);font-weight:900;white-space:nowrap}
.lt{text-align:center;color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:8px;margin:0 auto}
.c{aspect-ratio:1;border:0;padding:0;background:none;perspective:600px;cursor:pointer}
.in{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .3s}
.c.on .in,.c.ok .in{transform:rotateY(180deg)}
.bk,.fr{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden}
.bk{background:var(--b);box-shadow:0 4px 0 var(--bs)}
.bk:after{content:"";width:34%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.35)}
.fr{background:var(--surf);border:2px solid var(--bd);box-shadow:0 4px 0 var(--bd);font-size:var(--fs);transform:rotateY(180deg)}
.ok .fr{background:var(--okbg);border-color:var(--g);box-shadow:0 4px 0 var(--gs)}
.c.no .fr{background:var(--nobg);border-color:var(--r);box-shadow:0 4px 0 var(--rs)}
@media (prefers-reduced-motion:reduce){.in,.pg i,.sh{transition:none}}
.sh{position:fixed;inset-inline:0;bottom:0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;transform:translateY(110%);transition:transform .3s}
.sh.show{transform:none}
.sh.win{background:var(--okbg);color:var(--gs)}
.sh.lose{background:var(--nobg);color:var(--rs)}
.sh b{display:block;font-size:24px;font-weight:900}
.sh span{font-size:22px;color:var(--y);letter-spacing:3px}
.bt{border:0;border-radius:16px;padding:14px 32px;font:900 17px inherit;font-family:inherit;text-transform:uppercase;cursor:pointer;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gs)}
.bt:active{translate:0 4px;box-shadow:none}
.lose .bt{background:var(--r);box-shadow:0 4px 0 var(--rs)}
html:not([lang=ar]):not([lang=zh]) .bt{letter-spacing:.8px}
</style>
</head>
<body>
<section id="home">
<a id="back" href="../index.html"></a>
<h1 id="pk"></h1>
<div class="path" id="path"></div>
</section>
<section id="game" hidden>
<div class="tb"><button class="x" id="cl" aria-label="×">×</button><div class="pg"><i id="pb"></i></div><span class="hr" id="hr"></span></div>
<p class="lt" id="lt"></p>
<div class="grid" id="g"></div>
</section>
<div class="sh" id="sh" role="status"><div><b id="st"></b><span id="ss"></span></div><button class="bt" id="sb"></button></div>

<script>
var T={en:{back:"← All games",pick:"Choose a level",lvl:"Level",ok:"Excellent!",bad:"Out of hearts",go:"Continue",retry:"Try again"},ar:{back:"→ كل الألعاب",pick:"اختر مستوى",lvl:"المستوى",ok:"ممتاز!",bad:"انتهت القلوب",go:"متابعة",retry:"حاول مجدداً"},es:{back:"← Todos los juegos",pick:"Elige un nivel",lvl:"Nivel",ok:"¡Excelente!",bad:"Sin corazones",go:"Continuar",retry:"Reintentar"},fr:{back:"← Tous les jeux",pick:"Choisis un niveau",lvl:"Niveau",ok:"Excellent !",bad:"Plus de cœurs",go:"Continuer",retry:"Réessayer"},de:{back:"← Alle Spiele",pick:"Wähle ein Level",lvl:"Level",ok:"Ausgezeichnet!",bad:"Keine Herzen mehr",go:"Weiter",retry:"Nochmal"},zh:{back:"← 所有游戏",pick:"选择关卡",lvl:"关卡",ok:"太棒了！",bad:"爱心用完了",go:"继续",retry:"再试一次"}};
var l="en",th=null;try{l=localStorage.getItem("lang")||(navigator.language||"en").slice(0,2);th=localStorage.getItem("theme")}catch(e){}
if(!T[l])l="en";var t=T[l],R=document.documentElement;
R.lang=l;R.dir=l==="ar"?"rtl":"ltr";if(th)R.dataset.theme=th;
var $=function(i){return document.getElementById(i)};
$("back").textContent=t.back;$("pk").textContent=t.pick;
// [cards, columns, hearts]
var LV=[[6,3,6],[8,4,6],[10,5,6],[12,4,6],[16,4,7],[20,5,8],[24,6,8],[28,4,9],[32,4,10],[36,6,10]];
var FS={3:56,4:44,5:34,6:28};
var E=["🦉","🍎","🚀","🌟","🐱","🍕","⚽","🎸","🌈","🍓","🐢","🎨","🦊","🍩","⛵","🎧","🌵","🐙"];
var P={max:1,st:{}};try{P=JSON.parse(localStorage.getItem("memProg"))||P}catch(e){}
function save(){try{localStorage.setItem("memProg",JSON.stringify(P))}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function stars(n){return "★★★".slice(0,n)+"☆☆☆".slice(0,3-n)}
function home(){
$("sh").classList.remove("show");$("game").hidden=true;$("home").hidden=false;
var p=$("path");p.innerHTML="";
LV.forEach(function(c,i){var n=i+1,b=document.createElement("button");
b.className="nd"+(n===10?" hard":"");b.style.setProperty("--x",Math.round(Math.sin(i*.9)*56)+"px");
b.textContent=n===10?"🔥":n;b.disabled=n>P.max;b.setAttribute("aria-label",t.lvl+" "+n);
if(P.st[n]){var s=document.createElement("small");s.textContent=stars(P.st[n]);b.appendChild(s)}
b.onclick=function(){play(n)};p.appendChild(b)})}
var cur,cfg,hearts,mist,matched,first,lock;
function play(n){
cur=n;cfg=LV[n-1];hearts=cfg[2];mist=0;matched=0;first=null;lock=false;
$("sh").classList.remove("show");$("home").hidden=true;$("game").hidden=false;
$("lt").textContent=t.lvl+" "+n;upd();
var d=shuffle(E.slice()).slice(0,cfg[0]/2);d=shuffle(d.concat(d));
var g=$("g");g.innerHTML="";g.style.gridTemplateColumns="repeat("+cfg[1]+",1fr)";
g.style.maxWidth=(cfg[0]>=28&&cfg[1]===4?300:440)+"px";g.style.setProperty("--fs",FS[cfg[1]]+"px");
d.forEach(function(e){var b=document.createElement("button");b.className="c";b.dataset.e=e;b.setAttribute("aria-label","?");
b.innerHTML='<span class="in"><span class="bk"></span><span class="fr">'+e+'</span></span>';
b.onclick=function(){flip(b)};g.appendChild(b)})}
function upd(){$("hr").textContent="❤️ "+hearts;$("pb").style.width=(matched/(cfg[0]/2)*100)+"%"}
function flip(b){
if(lock||b.classList.contains("on")||b.classList.contains("ok"))return;
b.classList.add("on");b.setAttribute("aria-label",b.dataset.e);
if(!first){first=b;return}
var a=first;first=null;
if(a.dataset.e===b.dataset.e){a.className=b.className="c ok";matched++;upd();if(matched===cfg[0]/2)setTimeout(win,500);return}
mist++;hearts--;lock=true;a.classList.add("no");b.classList.add("no");upd();
setTimeout(function(){["on","no"].forEach(function(k){a.classList.remove(k);b.classList.remove(k)});
a.setAttribute("aria-label","?");b.setAttribute("aria-label","?");lock=false;if(hearts<=0)lose()},900-cur*45)}
function sheet(c,title,sub,label,fn){var s=$("sh");s.className="sh "+c;$("st").textContent=title;$("ss").textContent=sub;
$("sb").textContent=label;$("sb").onclick=fn;void s.offsetWidth;s.classList.add("show");$("sb").focus()}
function win(){
var s=mist<=1?3:mist<=Math.ceil(cfg[2]/2)?2:1;
if(!P.st[cur]||s>P.st[cur])P.st[cur]=s;if(cur===P.max&&cur<10)P.max=cur+1;save();
sheet("win",t.ok,stars(s),t.go,function(){cur<10?play(cur+1):home()})}
function lose(){lock=true;sheet("lose",t.bad,"","\u21BB "+t.retry,function(){play(cur)})}
$("cl").onclick=home;
home();
</script>
</body>
</html>
