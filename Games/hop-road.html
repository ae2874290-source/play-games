<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hop Road</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#6ec0ff;overflow:hidden;overscroll-behavior:none}
body{font:700 14px/1.4 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.px{font-family:"Press Start 2P",monospace;text-shadow:3px 0 #000,-3px 0 #000,0 3px #000,0 -3px #000,3px 3px #000,-3px -3px #000,3px -3px #000,-3px 3px #000}
.hud{position:fixed;inset-inline:0;top:env(safe-area-inset-top,0px);padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
#sc{font-size:34px;color:#fff}
.cn{text-align:end}
#cn{font-size:26px;color:#ffd93b}
.cn i{display:inline-block;margin-inline-start:6px;width:20px;height:20px;background:#ffd93b;border:3px solid #000;color:#d62b1f;font:normal 11px/14px "Press Start 2P",monospace;text-align:center;text-shadow:none}
#pz{pointer-events:auto;display:block;margin:10px 0 0 auto;width:48px;height:48px;border:3px solid #fff;border-radius:12px;background:#2f9cf0;color:#fff;font-size:16px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;background:rgba(10,40,80,.35)}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:clamp(28px,9vw,44px);line-height:1.3;color:#ffd93b}
.ov h2{margin:0;font-size:24px;color:#fff}
.big{font-size:44px;color:#fff}
.btn{border:4px solid #c71f1f;border-radius:6px;background:#f4b52e;color:#fff;min-width:200px;padding:16px 24px;font-size:18px;cursor:pointer;box-shadow:0 6px 0 #b37a10}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b37a10}
.btn:focus-visible,#pz:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}
select{background:rgba(0,0,0,.45);color:#fff;border:2px solid #fff;border-radius:999px;padding:8px 16px;font:inherit}
a{color:#fff;text-decoration:none;opacity:.9}
.sm{font-size:12px;opacity:.95}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud"><div class="px" id="sc">0</div><div class="cn"><span class="px" id="cn">0</span><i>c</i><button id="pz" aria-label="pause">❚❚</button></div></div>

<div class="ov" id="st">
<h1 class="px">HOP<br>ROAD</h1>
<button class="btn px" id="go" aria-label="play">▶</button>
<div class="px sm" id="bs"></div>
<div id="tp"></div>
<select id="lang" aria-label="Language"></select>
<a id="back" href="../index.html"></a>
</div>
<div class="ov" id="ps" hidden><h2 class="px" id="pt"></h2><button class="btn px" id="rs">▶</button></div>
<div class="ov" id="ov" hidden><h2 id="ot"></h2><div class="px big" id="os">0</div><div class="px sm" id="ob"></div><button class="btn" id="ag"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var TT={en:{back:"← All games",best:"BEST",again:"Play again",over:"Game over",paused:"Paused",tap:"Tap to hop · swipe to turn"},
ar:{back:"→ كل الألعاب",best:"الأفضل",again:"العب مجدداً",over:"انتهت اللعبة",paused:"متوقفة",tap:"المس للقفز · اسحب للاتجاه"},
es:{back:"← Todos los juegos",best:"MEJOR",again:"Jugar de nuevo",over:"Fin del juego",paused:"En pausa",tap:"Toca para saltar · desliza para girar"},
fr:{back:"← Tous les jeux",best:"RECORD",again:"Rejouer",over:"Partie terminée",paused:"Pause",tap:"Touche pour sauter · glisse pour tourner"},
de:{back:"← Alle Spiele",best:"BESTWERT",again:"Nochmal",over:"Spiel vorbei",paused:"Pausiert",tap:"Tippen zum Hüpfen · wischen zum Drehen"},
zh:{back:"← 所有游戏",best:"最高分",again:"再来一局",over:"游戏结束",paused:"已暂停",tap:"点按跳跃 · 滑动转向"}};
var $=function(i){return document.getElementById(i)};
var l="en",best=0,coins=0;
try{l=localStorage.getItem("lang")||"en";best=+localStorage.getItem("hrBest")||0;coins=+localStorage.getItem("hrCoins")||0}catch(e){}
if(!TT[l])l="en";var t;
function lang(x){l=x;t=TT[x];var d=document.documentElement;d.lang=x;d.dir=x==="ar"?"rtl":"ltr";
$("back").textContent=t.back;$("tp").textContent=t.tap;$("pt").textContent=t.paused;$("ot").textContent=t.over;$("ag").textContent=t.again;
$("bs").textContent=t.best+" "+best;try{localStorage.setItem("lang",x)}catch(e){}}
lang(l);
var NM={en:"English",ar:"العربية",es:"Español",fr:"Français",de:"Deutsch",zh:"中文"},sel=$("lang");
Object.keys(TT).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=NM[k];sel.appendChild(o)});
sel.value=l;sel.onchange=function(){lang(sel.value)};
$("cn").textContent=coins;

/* ---------- three.js setup ---------- */
var cv=$("cv"),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
var sc=new THREE.Scene();sc.background=new THREE.Color(0x6ec0ff);
var cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
function fit(){var w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);
var hh=6.5,hw=hh*w/h;if(hw<5){hw=5;hh=hw*h/w}
cam.left=-hw;cam.right=hw;cam.top=hh;cam.bottom=-hh;cam.updateProjectionMatrix()}
fit();window.addEventListener("resize",fit);
sc.add(new THREE.AmbientLight(0xffffff,.72));
var sun=new THREE.DirectionalLight(0xffffff,.8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
var sh=sun.shadow.camera;sh.left=-13;sh.right=13;sh.top=13;sh.bottom=-13;sh.near=1;sh.far=50;sh.updateProjectionMatrix();sc.add(sun);sc.add(sun.target);

var GC={},MC={};
function mat(c){return MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c}))}
function bx(w,h,d,c,x,y,z,cast){var k=w+","+h+","+d,g=GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d)),m=new THREE.Mesh(g,mat(c));
m.position.set(x,y,z);m.castShadow=cast!==false;m.receiveShadow=true;return m}

/* ---------- world ---------- */
var FT={g:0,r:-.1,w:-.4},lanes={},maxGen=-1;
function pick(p,r){if(r<4)return"g";var x=Math.random(),pt=p&&p.t;
if(pt==="g")return x<.55?"r":x<.8?"w":"g";
if(pt==="r")return x<.5?"r":x<.7?"g":"w";
return x<.4?"w":x<.8?"g":"r"}
function tree(L,x){var h=.9+Math.random()*1;
L.g.add(bx(.35,.4,.35,0x6b4226,x,.2,0));L.g.add(bx(.85,h,.85,0x5fa032,x,.4+h/2,0))}
function grass(L){
for(var x=-8;x<=8;x++){var free=Math.abs(x)<=1&&L.r<4;if(free||L.r<2)continue;
if(Math.random()<.2){tree(L,x);L.tr[x]=1}
else if(Math.random()<.1){var c=bx(.35,.35,.12,0xffd93b,x,.55,0);L.g.add(c);L.co[x]=c}}
for(var e=9;e<=13;e++){if(Math.random()<.75)tree(L,e);if(Math.random()<.75)tree(L,-e)}}
function car(L,x,w,tk,sp){
var g=new THREE.Group(),cols=[0xe8452c,0x3b82f6,0xf5c518,0x4caf50,0xb04bd8],c=cols[Math.floor(Math.random()*5)];
if(tk){g.add(bx(w*.72,.85,.85,0xdfe6f2,-w*.14,.55,0));g.add(bx(w*.26,.65,.8,c,w*.37,.45,0))}
else{g.add(bx(w,.45,.8,c,0,.32,0));g.add(bx(w*.55,.38,.7,0xffffff,-w*.05,.7,0))}
g.add(bx(w*.9,.14,.88,0x222233,0,.12,0,false));
g.position.set(x,FT.r,0);g.scale.x=sp>0?1:-1;L.g.add(g);return{m:g,x:x,w:w,sp:sp}}
function road(L){var d=Math.random()<.5?1:-1,sp=(1.6+Math.random()*3)*d,x=-14+Math.random()*4;
while(x<14){var tk=Math.random()<.25,w=tk?2.6:1.3;L.it.push(car(L,x,w,tk,sp));x+=w+2.4+Math.random()*5}}
function river(L){var d=Math.random()<.5?1:-1,sp=(.8+Math.random()*1.4)*d,x=-14+Math.random()*3;
while(x<14){var w=2+Math.floor(Math.random()*3),g=new THREE.Group();
g.add(bx(w,.3,.8,0x8a5a3b,0,-.25,0));g.position.x=x;L.g.add(g);L.it.push({m:g,x:x,w:w,sp:sp});x+=w+1.4+Math.random()*2.2}}
function mk(r){
var t=pick(lanes[r-1],r),L={r:r,t:t,g:new THREE.Group(),it:[],tr:{},co:{}};
L.g.position.z=-r;
var col=t==="g"?(r%2?0x8fd14f:0x7fc844):t==="r"?0x4d4f6e:0x3da5f4;
L.g.add(bx(32,.4,1,col,0,FT[t]-.2,0,false));
if(t==="g")grass(L);else if(t==="r")road(L);else river(L);
sc.add(L.g);lanes[r]=L}
function need(n){while(maxGen<n)mk(++maxGen)}
function upd(L,dt){L.it.forEach(function(i){i.x+=i.sp*dt;if(i.x>15)i.x-=30;else if(i.x<-15)i.x+=30;i.m.position.x=i.x})}

/* ---------- player ---------- */
var P={g:new THREE.Group(),m:new THREE.Group(),x:0,r:0,vr:0,hop:false,ht:0,fx:0,fr:0,tx:0,tr:0,ride:null,off:0};
P.m.add(bx(.7,.7,.7,0xffffff,0,.4,0));P.m.add(bx(.18,.22,.3,0xe8332b,0,.9,-.05));
P.m.add(bx(.22,.16,.2,0xf29a1f,0,.45,-.42));P.m.add(bx(.12,.16,.1,0xe8332b,0,.3,-.4));
P.m.add(bx(.08,.12,.08,0x111111,.37,.55,-.15));P.m.add(bx(.08,.12,.08,0x111111,-.37,.55,-.15));
P.g.add(P.m);sc.add(P.g);

var ready=false,started=false,over=false,paused=false,sink=false,maxR=0,camR=2,camZ=2,cx=0,last=0;
function hop(dx,dr){
if(!ready||over||paused||P.hop)return;
var nx=Math.round(P.x)+dx,nr=P.r+dr;
if(Math.abs(nx)>8||nr<0||nr<maxR-3)return;
need(nr+16);var L=lanes[nr];if(L.t==="g"&&L.tr[nx])return;
started=true;P.fx=P.x;P.fr=P.r;P.tx=nx;P.tr=nr;P.ht=0;P.hop=true;P.ride=null;
P.m.rotation.y=dx>0?-Math.PI/2:dx<0?Math.PI/2:dr>0?0:Math.PI}
function land(){
var L=lanes[P.r];
if(P.r>maxR){maxR=P.r;$("sc").textContent=maxR}
if(L.t==="g"){var k=Math.round(P.x);if(L.co[k]){L.g.remove(L.co[k]);delete L.co[k];coins++;$("cn").textContent=coins;try{localStorage.setItem("hrCoins",coins)}catch(e){}}}
if(L.t==="w"){var lg=null;L.it.forEach(function(i){if(Math.abs(i.x-P.x)<i.w/2+.15)lg=i});
if(lg){P.ride=lg;P.off=P.x-lg.x}else die("water")}}
function die(k){
if(over)return;over=true;P.hop=false;
if(k==="car"){P.m.scale.y=.12;P.g.position.y=FT.r}
if(k==="water")sink=true;
if(maxR>best){best=maxR;try{localStorage.setItem("hrBest",best)}catch(e){}}
setTimeout(function(){$("os").textContent=maxR;$("ob").textContent=t.best+" "+best;$("ov").hidden=false;$("ag").focus()},800)}
function reset(){
for(var k in lanes){sc.remove(lanes[k].g)}lanes={};maxGen=-1;need(30);
P.x=0;P.r=0;P.vr=0;P.hop=false;P.ride=null;P.m.scale.set(1,1,1);P.m.rotation.y=0;
over=false;sink=false;started=false;maxR=0;camR=2;camZ=2;cx=0;$("sc").textContent="0";$("ov").hidden=true}

function frame(now){
requestAnimationFrame(frame);
var dt=Math.min((now-last)/1000,.05);last=now;if(!(dt>0))dt=.016;
if(!paused){
for(var k in lanes)upd(lanes[k],dt);
if(!over){
 if(P.hop){P.ht+=dt/.15;var f=Math.min(P.ht,1);P.x=P.fx+(P.tx-P.fx)*f;P.vr=P.fr+(P.tr-P.fr)*f;
  var gl=lanes[Math.round(P.vr)];P.g.position.y=(gl?FT[gl.t]:0)+Math.sin(f*Math.PI)*.5;
  if(f>=1){P.hop=false;P.r=P.tr;P.vr=P.r;P.x=P.tx;P.g.position.y=FT[lanes[P.r].t];land()}}
 else{var L=lanes[P.r];
  if(P.ride){P.x=P.ride.x+P.off;P.g.position.y=-.1;if(Math.abs(P.x)>9.6)die("water")}
  else if(L.t==="r"){L.it.forEach(function(i){if(Math.abs(i.x-P.x)<i.w/2+.28)die("car")})}}
 if(started&&!over&&P.vr<camR-5)die("late")}
else if(sink)P.g.position.y-=dt*2;
P.g.position.x=P.x;P.g.position.z=-P.vr;
camR=Math.max(camR+(started&&!over?dt*.3:0),P.vr-1);
camZ+=(camR-camZ)*Math.min(1,dt*5);cx+=(P.x*.5-cx)*Math.min(1,dt*4);
need(Math.ceil(camR)+22);
for(var q in lanes)if(+q<camR-12){sc.remove(lanes[q].g);delete lanes[q]}
}
cam.position.set(cx+5,9,-camZ+7);cam.lookAt(cx,0,-camZ-1.5);
sun.position.set(cx-5,12,-camZ+6);sun.target.position.set(cx,0,-camZ);
R.render(sc,cam)}

/* ---------- input & UI ---------- */
function setPause(p){if(!ready||over)return;paused=p;$("ps").hidden=!p}
$("go").onclick=function(){$("st").hidden=true;ready=true};
$("pz").onclick=function(){setPause(!paused)};
$("rs").onclick=function(){setPause(false)};
$("ag").onclick=reset;
document.addEventListener("visibilitychange",function(){if(document.hidden)setPause(true)});
document.addEventListener("keydown",function(e){
var m={ArrowUp:[0,1],w:[0,1],ArrowDown:[0,-1],s:[0,-1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]," ":[0,1]}[e.key];
if(m){e.preventDefault();hop(m[0],m[1])}else if(e.key==="p")setPause(!paused)});
var sx=0,sy=0,tracking=false;
cv.addEventListener("pointerdown",function(e){sx=e.clientX;sy=e.clientY;tracking=true});
cv.addEventListener("pointerup",function(e){if(!tracking)return;tracking=false;
var dx=e.clientX-sx,dy=e.clientY-sy;
if(Math.abs(dx)<24&&Math.abs(dy)<24)hop(0,1);
else if(Math.abs(dx)>Math.abs(dy))hop(dx>0?1:-1,0);
else hop(0,dy<0?1:-1)});
need(30);
requestAnimationFrame(frame);
</script>
</body>
</html>
